<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>brief.thegoodweb.eu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#001858;--sky:#79BEFF;--sky-light:#E8F4FF;--sky-mid:#B3DBFF;--orange:#F3562D;
  --white:#fff;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
  --gray-400:#9ca3af;--gray-600:#4b5563;--gray-800:#1f2937;
  --green:#16a34a;--green-light:#dcfce7;--amber:#d97706;--amber-light:#fef3c7;
  --red:#dc2626;--red-light:#fee2e2;--purple:#7c3aed;--purple-light:#ede9fe;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
html,body{height:100%;font-family:var(--font);background:var(--gray-50);color:var(--gray-800)}
.app{display:flex;flex-direction:column;min-height:100vh}

/* TOPBAR */
.topbar{background:var(--navy);padding:0 32px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;flex-direction:column;line-height:1.1;gap:1px;text-decoration:none}
.logo-main{font-size:14px;font-weight:600;color:#fff;letter-spacing:.05em}
.logo-sub{font-size:8.5px;color:var(--sky);letter-spacing:.12em}
.topbar-nav{display:flex;align-items:center;gap:4px}
.nav-btn{padding:6px 16px;border-radius:100px;font-size:12.5px;cursor:pointer;color:rgba(255,255,255,.65);border:none;background:none;font-family:var(--font);transition:all .15s}
.nav-btn:hover{color:#fff}
.nav-btn.active{background:rgba(255,255,255,.1);color:#fff}
.nav-btn.cta{border:1px solid rgba(121,190,255,.5);color:#fff;opacity:.9;margin-left:4px}
.nav-btn.cta:hover{border-color:var(--sky);background:rgba(121,190,255,.08);opacity:1}
.nav-btn.cta.active{background:rgba(121,190,255,.12);border-color:var(--sky)}
.nav-user{font-size:12px;color:rgba(255,255,255,.5);margin-right:8px}
.nav-logout{font-size:12px;color:rgba(255,255,255,.4);cursor:pointer;border:none;background:none;font-family:var(--font);padding:4px 8px;border-radius:6px;transition:all .15s}
.nav-logout:hover{color:#fff;background:rgba(255,255,255,.08)}

/* MOBILE RESPONSIVE */
@media (max-width: 640px) {
  .topbar{padding:0 16px;height:auto;min-height:56px;flex-wrap:wrap;gap:8px;padding-top:10px;padding-bottom:10px}
  .logo{order:1}
  .topbar-nav{order:2;width:100%;justify-content:flex-start;flex-wrap:wrap;gap:4px;padding-bottom:4px}
  .nav-user{display:none}
  .nav-logout{font-size:11px;padding:3px 8px}
  .nav-btn{font-size:11.5px;padding:5px 10px}
  .nav-btn.cta{font-size:11.5px;padding:5px 10px}
  .main{padding:20px 16px}
  .main.wide{max-width:100%}
  .grid2{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{padding:12px 8px}
  .stat-n{font-size:22px}
  .stat-l{font-size:10px}
  .detail-grid{grid-template-columns:1fr}
  .detail-item[style*="span 2"]{grid-column:span 1}
  .auth-card{padding:28px 20px}
  .step-header{flex-direction:column;align-items:flex-start;gap:10px}
  .progress{align-self:flex-start}
  .btn-row{flex-direction:column-reverse;gap:10px}
  .btn-row .btn-back,.btn-row .btn-next{width:100%;text-align:center;justify-content:center}
  .filter-bar{gap:5px}
  .filter-btn{font-size:11px;padding:4px 10px}
  .brief-row{flex-wrap:wrap;gap:8px}
  .brief-row:hover{margin:0;padding:11px 0}
  .page-title{font-size:18px}
  .com-card{padding:10px 12px}
  .chips{gap:5px}
  .chip{font-size:12px;padding:5px 10px}
  .toggle-row .tog{padding:8px 6px;font-size:12.5px}
  .confirm-wrap{margin:20px auto}
  .confirm-card{padding:28px 20px}
  .url-add{flex-direction:column}
  .url-add button{padding:9px;border-radius:9px}
  .topbar-nav .nav-user{display:none}
}

/* MAIN */
.main{flex:1;padding:32px 24px;max-width:680px;margin:0 auto;width:100%}
.main.wide{max-width:900px}

/* AUTH PAGE */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:24px}
.auth-card{background:#fff;border-radius:16px;padding:40px 36px;width:100%;max-width:400px}
.auth-logo{display:flex;flex-direction:column;align-items:center;margin-bottom:28px;gap:2px}
.auth-logo-main{font-size:20px;font-weight:700;color:var(--navy);letter-spacing:.05em}
.auth-logo-sub{font-size:10px;color:var(--sky);letter-spacing:.12em}
.auth-title{font-size:18px;font-weight:500;color:var(--navy);margin-bottom:6px;text-align:center}
.auth-sub{font-size:13px;color:var(--gray-400);text-align:center;margin-bottom:24px}
.auth-tabs{display:flex;gap:0;margin-bottom:24px;border:1px solid var(--gray-200);border-radius:9px;overflow:hidden}
.auth-tab{flex:1;padding:9px;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--gray-400);border:none;font-family:var(--font);transition:all .15s;text-align:center}
.auth-tab.on{background:var(--navy);color:#fff}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--gray-600);margin-bottom:5px;font-weight:500}
.field input,.field select{width:100%;font-size:14px;border:1px solid var(--gray-200);border-radius:9px;padding:10px 12px;background:#fff;color:var(--gray-800);outline:none;transition:border .15s,box-shadow .15s;font-family:var(--font)}
.field input:focus,.field select:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(121,190,255,.15)}
.field textarea{width:100%;font-size:14px;border:1px solid var(--gray-200);border-radius:9px;padding:10px 12px;background:#fff;color:var(--gray-800);outline:none;transition:border .15s;font-family:var(--font);resize:vertical;min-height:72px;line-height:1.5}
.field textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(121,190,255,.15)}
.btn-primary{width:100%;background:var(--navy);border:none;border-radius:9px;padding:11px;font-size:14px;font-weight:500;cursor:pointer;color:#fff;font-family:var(--font);transition:opacity .15s;margin-top:4px}
.btn-primary:hover{opacity:.85}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-google{width:100%;background:#fff;border:1px solid var(--gray-200);border-radius:9px;padding:11px;font-size:14px;font-weight:400;cursor:pointer;color:var(--gray-700);font-family:var(--font);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.btn-google:hover{border-color:var(--gray-400);background:var(--gray-50)}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--gray-400);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--gray-200)}
.auth-error{background:var(--red-light);color:var(--red);font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px;display:none}
.auth-error.show{display:block}

/* CARDS */
.card{background:#fff;border:1px solid var(--gray-200);border-radius:14px;padding:20px;margin-bottom:12px}
.card-label{font-size:10.5px;font-weight:500;color:var(--sky);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.card-label::before{content:'';width:3px;height:12px;background:var(--sky);border-radius:2px;display:inline-block}

/* FORM */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border:1px solid var(--gray-200);border-radius:100px;font-size:13px;cursor:pointer;color:var(--gray-600);background:#fff;transition:all .15s;user-select:none;font-family:var(--font)}
.chip:hover{border-color:var(--sky-mid)}
.chip.on{border-color:var(--sky);color:var(--navy);background:var(--sky-light);font-weight:500}
.toggle-row{display:flex;gap:8px;margin-top:6px}
.tog{flex:1;padding:9px;border:1px solid var(--gray-200);border-radius:9px;font-size:13.5px;cursor:pointer;background:#fff;color:var(--gray-600);transition:all .15s;text-align:center;font-family:var(--font)}
.tog.on{border-color:var(--sky);background:var(--sky-light);color:var(--navy);font-weight:500}

/* PROGRESS */
.step-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.step-info .step-title{font-size:21px;font-weight:500;color:var(--navy)}
.step-info .step-meta{font-size:12.5px;color:var(--gray-400);margin-top:2px}
.progress{display:flex;gap:5px}
.pdot{height:3px;width:28px;border-radius:3px;background:var(--gray-200);transition:background .3s}
.pdot.done{background:var(--sky)}
.pdot.cur{background:rgba(121,190,255,.45)}

/* BUTTONS */
.btn-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.btn-back{background:none;border:1px solid var(--gray-200);border-radius:9px;padding:9px 20px;font-size:13.5px;cursor:pointer;color:var(--gray-600);font-family:var(--font)}
.btn-next{background:var(--navy);border:none;border-radius:9px;padding:10px 24px;font-size:13.5px;font-weight:500;cursor:pointer;color:#fff;font-family:var(--font);transition:opacity .15s}
.btn-next:hover{opacity:.85}
.btn-next:disabled{opacity:.5;cursor:not-allowed}
.btn-sky{background:var(--sky-light);border:1px solid var(--sky);border-radius:9px;padding:10px 24px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--navy);font-family:var(--font)}

/* URL */
.url-add{display:flex;gap:8px;margin-top:8px}
.url-add input{flex:1;font-size:13.5px;border:1px solid var(--gray-200);border-radius:9px;padding:8px 12px;background:#fff;color:var(--gray-800);outline:none;font-family:var(--font)}
.url-add input:focus{border-color:var(--sky)}
.url-add button{padding:0 14px;border:1px solid var(--gray-200);border-radius:9px;background:var(--gray-50);font-size:13px;cursor:pointer;color:var(--gray-600);font-family:var(--font)}
.url-tag{display:inline-flex;align-items:center;gap:5px;background:var(--sky-light);border:1px solid var(--sky-mid);border-radius:100px;padding:3px 10px;font-size:12px;color:var(--navy);margin:4px 4px 0 0}
.url-tag button{background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:14px;line-height:1;padding:0}

/* COMMERCIAL */
.com-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--gray-200);border-radius:11px;cursor:pointer;transition:all .15s;margin-bottom:8px}
.com-card:hover{border-color:var(--sky-mid)}
.com-card.on{border-color:var(--sky);background:var(--sky-light)}
.com-avatar{width:38px;height:38px;border-radius:50%;background:var(--sky-light);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--navy);flex-shrink:0;border:1px solid var(--gray-200);font-family:var(--mono)}
.com-card.on .com-avatar{background:#fff;border-color:var(--sky)}

/* CONFIRM */
.confirm-wrap{max-width:440px;margin:40px auto}
.confirm-card{background:#fff;border:1px solid var(--gray-200);border-radius:16px;padding:40px 28px;text-align:center}
.confirm-ring{width:56px;height:56px;border-radius:50%;background:var(--sky-light);border:2px solid var(--sky);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:var(--navy);font-size:24px}
.confirm-sig{font-size:11px;font-weight:600;color:var(--navy);letter-spacing:.1em;margin-top:20px;opacity:.35;text-transform:uppercase}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--gray-200);border-radius:12px;padding:16px;text-align:center}
.stat-n{font-size:26px;font-weight:500;font-family:var(--mono)}
.stat-l{font-size:11px;color:var(--gray-400);margin-top:3px}

/* BRIEF ROWS */
.brief-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--gray-100);cursor:pointer;transition:background .1s}
.brief-row:last-child{border-bottom:none}
.brief-row:hover{background:var(--gray-50);margin:0 -8px;padding:11px 8px;border-radius:8px}
.b-avatar{width:36px;height:36px;border-radius:50%;background:var(--sky-light);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--navy);flex-shrink:0;font-family:var(--mono)}
.b-info{flex:1;min-width:0}
.b-name{font-size:13.5px;font-weight:500;color:var(--gray-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-meta{font-size:11.5px;color:var(--gray-400);margin-top:2px}

/* BADGES / STATUTS */
.badge{display:inline-block;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:500;white-space:nowrap}
.badge-nouveau{background:var(--sky-light);color:var(--navy)}
.badge-traitement{background:var(--amber-light);color:var(--amber)}
.badge-attente{background:var(--purple-light);color:var(--purple)}
.badge-gagne{background:var(--green-light);color:var(--green)}
.badge-perdu{background:var(--red-light);color:var(--red)}

/* STATUS SELECT */
.status-select{font-size:12px;border:1px solid var(--gray-200);border-radius:20px;padding:3px 8px;cursor:pointer;font-family:var(--font);background:#fff;outline:none;font-weight:500}
.status-select.badge-nouveau{background:var(--sky-light);color:var(--navy);border-color:var(--sky-mid)}
.status-select.badge-traitement{background:var(--amber-light);color:var(--amber);border-color:#fcd34d}
.status-select.badge-attente{background:var(--purple-light);color:var(--purple);border-color:#c4b5fd}
.status-select.badge-gagne{background:var(--green-light);color:var(--green);border-color:#86efac}
.status-select.badge-perdu{background:var(--red-light);color:var(--red);border-color:#fca5a5}

/* FILTERS */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filter-btn{padding:5px 13px;border-radius:100px;font-size:12px;border:1px solid var(--gray-200);background:#fff;color:var(--gray-600);cursor:pointer;font-family:var(--font);transition:all .15s}
.filter-btn.on{border-color:var(--sky);background:var(--sky-light);color:var(--navy);font-weight:500}

/* TIMELINE */
.tl{list-style:none}
.tl-item{display:flex;gap:10px;padding-bottom:14px;position:relative}
.tl-dot{width:10px;height:10px;border-radius:50%;background:var(--sky);flex-shrink:0;margin-top:4px}
.tl-line{position:absolute;left:4px;top:14px;bottom:0;width:1px;background:var(--gray-100)}
.tl-item:last-child .tl-line{display:none}
.tl-text{font-size:13px;color:var(--gray-800);line-height:1.5}
.tl-date{font-size:11px;color:var(--gray-400);margin-top:2px}

/* BAR */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-track{flex:1;height:5px;border-radius:3px;background:var(--gray-100);overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:var(--sky)}

/* PAGE */
.page-title{font-size:22px;font-weight:500;color:var(--navy);margin-bottom:4px}
.page-sub{font-size:13.5px;color:var(--gray-400);margin-bottom:24px}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--gray-400);font-size:14px}

/* DETAIL */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-item{background:var(--gray-50);border-radius:9px;padding:12px}
.detail-label{font-size:11px;color:var(--gray-400);font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.detail-value{font-size:13.5px;color:var(--gray-800)}
.btn-back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--gray-400);cursor:pointer;border:none;background:none;font-family:var(--font);padding:0;margin-bottom:20px}
.btn-back-link:hover{color:var(--navy)}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const SUPABASE_URL = 'https://druqaaomblhpsgqqxvzi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Fq3gV3Tu6wEdeVNrFf98XA_wTsz2QCS';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const commerciaux = [
  {id:'jerome',name:'Jérôme',role:'Directeur commercial',init:'JR'},
  {id:'mathilde',name:'Mathilde',role:'Directrice de clientèle',init:'MT'},
  {id:'leslie',name:'Leslie',role:'Chargée de clientèle',init:'LS'},
];

const STATUTS = [
  {id:'nouveau',label:'Nouveau',badge:'badge-nouveau'},
  {id:'traitement',label:'En traitement',badge:'badge-traitement'},
  {id:'attente',label:'En attente client',badge:'badge-attente'},
  {id:'gagne',label:'Gagné',badge:'badge-gagne'},
  {id:'perdu',label:'Perdu',badge:'badge-perdu'},
];

const formSteps = ['Infos client','Objectif','Ciblages','Formats','URL','Contact','Infos complémentaires'];

let session = null;
let userRole = null; // 'regie' | 'client'
let view = 'form';
let formStep = 0;
let agFilter = 'all';
let statFilter = 'all';
let agArchiveFilter = 'active';
let clientArchiveFilter = 'active';
let dateFrom = '';
let dateTo = '';
let fd = {};
let briefs = [];
let nouveauxCount = 0;
let detailBrief = null;

const $ = id => document.getElementById(id);

// ─── INIT ───
async function init() {
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (session) {
    await detectRole();
    renderApp();
  } else {
    renderAuth();
  }
  sb.auth.onAuthStateChange(async (event, s) => {
    session = s;
    if (s) { await detectRole(); renderApp(); }
    else { userRole = null; renderAuth(); }
  });
}

async function detectRole() {
  // Check profiles table for role
  const { data } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
  userRole = data?.role || 'client';
  if (userRole === 'regie') view = 'agency';
  else view = 'client';
}

// ─── AUTH ───
let authMode = 'login';
function renderAuth() {
  $('app').innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-logo">
          <span class="auth-logo-main">THE GOOD WEB</span>
          <span class="auth-logo-sub">· THE GOOD AUDIENCE</span>
        </div>
        <div id="auth-error" class="auth-error"></div>
        ${userRole === null && authMode === 'login' ? `
          <div class="auth-tabs">
            <button class="auth-tab ${authMode==='login'?'on':''}" onclick="setAuthMode('login')">Connexion</button>
            <button class="auth-tab ${authMode==='signup'?'on':''}" onclick="setAuthMode('signup')">Créer un compte</button>
          </div>
        ` : ''}
        ${authMode === 'login' ? renderLoginForm() : renderSignupForm()}
      </div>
    </div>`;
}

function renderLoginForm() {
  return `
    <div class="auth-title">Bienvenue</div>
    <div class="auth-sub">Connectez-vous à votre espace</div>
    <div class="field"><label>Email</label><input id="auth-email" type="email" placeholder="votre@email.com" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="field">
      <label>Mot de passe</label>
      <div style="position:relative">
        <input id="auth-pwd" type="password" placeholder="••••••••" style="padding-right:40px" onkeydown="if(event.key==='Enter')doLogin()">
        <button onclick="togglePwd('auth-pwd',this)" type="button" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:16px;padding:0;line-height:1">👁</button>
      </div>
    </div>
    <div style="text-align:right;margin-bottom:12px;margin-top:-8px">
      <button onclick="showForgot()" style="background:none;border:none;font-size:12px;color:var(--sky);cursor:pointer;font-family:var(--font)">Mot de passe oublié ?</button>
    </div>
    <button class="btn-primary" onclick="doLogin()">Se connecter</button>
    <div class="divider">ou</div>
    <button class="btn-google" onclick="doGoogle()">

async function doLogin() {
  const email = $('auth-email')?.value;
  const pwd = $('auth-pwd')?.value;
  if (!email || !pwd) return showAuthError('Veuillez remplir tous les champs.');
  const el = $('auth-error');
  if (el) { el.style.display='none'; }
  const { error } = await sb.auth.signInWithPassword({ email, password: pwd });
  if (error) {
    setTimeout(() => showAuthError('Email ou mot de passe incorrect. Veuillez réessayer.'), 50);
  }
}

async function doSignup() {
  const email = $('auth-email')?.value;
  const pwd = $('auth-pwd')?.value;
  const company = $('auth-company')?.value;
  if (!email || !pwd || !company) return showAuthError('Veuillez remplir tous les champs.');
  const { error } = await sb.auth.signUp({ email, password: pwd, options: { data: { company } } });
  if (error) showAuthError(error.message);
  else showAuthError('Compte créé ! Vérifiez votre email pour confirmer.', 'green');
}

async function doGoogle() {
  await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } });
}

async function doLogout() {
  await sb.auth.signOut();
}

function showAuthError(msg, type='red') {
  const el = $('auth-error');
  if (!el) return;
  el.textContent = msg;
  el.style.display = 'block';
  el.style.background = type === 'green' ? 'var(--green-light)' : 'var(--red-light)';
  el.style.color = type === 'green' ? 'var(--green)' : 'var(--red)';
}

async function handleNext() {
  saveStep();
  if (formStep === 0) {
    if (!fd.compte || !fd.camp || !fd.email) {
      showFormError('Veuillez remplir les champs obligatoires : Compte, Nom de campagne et Email.');
      return;
    }
  }
  if (formStep === formSteps.length - 1) {
    await submitBrief();
  } else {
    formStep++;
    renderMain();
  }
}

function showFormError(msg) {
  let el = document.getElementById('form-error');
  if (!el) {
    el = document.createElement('div');
    el.id = 'form-error';
    el.style.cssText = 'background:var(--red-light);color:var(--red);font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px;';
    const btnRow = document.querySelector('.btn-row');
    if (btnRow) btnRow.parentNode.insertBefore(el, btnRow);
  }
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { if(el) el.style.display='none'; }, 4000);
}

async function submitBrief() {
  const btn = document.querySelector('.btn-next');
  if (btn) { btn.disabled = true; btn.textContent = 'Envoi…'; }
  const { error } = await sb.from('briefs').insert([{
    user_id: session.user.id,
    compte: fd.compte,
    campagne: fd.camp,
    debut: fd.deb,
    fin: fd.fin,
    budget: fd.budget,
    email_contact: fd.email,
    contact_name: fd.contactName || '',
    objectif: fd.obj,
    kpis: fd.kpis,
    geo: fd.geo,
    socio: fd.socio,
    signaux_financiers: fd.fin2,
    moments_vie: fd.moments,
    intentions: fd.intent,
    formats: fd.fmts ? fd.fmts.join(', ') : '',
    creas: fd.creas,
    url_principale: fd.urlMain,
    urls_secondaires: fd.urls ? fd.urls.join(', ') : '',
    commercial: fd.commercial,
    infos_complementaires: fd.infos || '',
    statut: 'nouveau',
    lien_plan_media: '',
    notes_internes: '',
    created_at: new Date().toISOString(),
  }]);
  if (error) { console.error(error); if (btn) { btn.disabled = false; btn.textContent = 'Envoyer le brief'; } return; }
  // Send notifications
  const comEmails = { jerome: 'jerome@thegoodweb.eu', mathilde: 'mathilde@thegoodweb.eu', leslie: 'leslie@thegoodweb.eu' };
  const briefData = {
    compte: fd.compte, campagne: fd.camp, objectif: fd.obj, budget: fd.budget,
    debut: fd.deb, fin: fd.fin, geo: fd.geo, email_contact: fd.email,
    commercial: fd.commercial, contact_name: fd.contactName || ''
  };
  fetch('/api/notify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      type: 'new_brief',
      brief: briefData,
      commercialEmail: comEmails[fd.commercial] || null,
      clientEmail: fd.email || null
    })
  }).catch(() => {});

  formStep = formSteps.length;
  renderMain();
}

    <div class="page-sub">Tous les briefs clients</div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-n">${briefs.length}</div><div class="stat-l">Total</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--navy)">${briefs.filter(b=>b.statut==='nouveau').length}</div><div class="stat-l">Nouveaux</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--amber)">${briefs.filter(b=>b.statut==='traitement'||b.statut==='attente').length}</div><div class="stat-l">En cours</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--green)">${briefs.filter(b=>b.statut==='gagne').length}</div><div class="stat-l">Gagnés</div></div>
    </div>
    <div class="card">
      <div class="card-label">Filtres</div>
      <div style="margin-bottom:10px">
        <div style="font-size:11px;color:var(--gray-400);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.06em">Commercial</div>
        <div class="filter-bar">
          <button class="filter-btn ${agFilter==='all'?'on':''}" onclick="agFilter='all';renderMain()">Tous</button>
          ${commerciaux.map(c=>`<button class="filter-btn ${agFilter===c.id?'on':''}" onclick="agFilter='${c.id}';renderMain()">${c.name} (${counts[c.id]})</button>`).join('')}
        </div>
      </div>
      <div>
        <div style="font-size:11px;color:var(--gray-400);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.06em">Statut</div>
        <div class="filter-bar">
          <button class="filter-btn ${statFilter==='all'?'on':''}" onclick="statFilter='all';renderMain()">Tous</button>
          ${STATUTS.map(s=>`<button class="filter-btn ${statFilter===s.id?'on':''}" onclick="statFilter='${s.id}';renderMain()">${s.label}</button>`).join('')}
        </div>
      </div>
      <div style="margin-top:12px">
        <div style="font-size:11px;color:var(--gray-400);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.06em">Période de réception</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:6px">
            <label style="font-size:12px;color:var(--gray-400)">Du</label>
            <input type="date" id="filter-from" value="${dateFrom}" onchange="dateFrom=this.value;renderMain()" style="font-size:12px;border:1px solid var(--gray-200);border-radius:8px;padding:5px 8px;background:#fff;color:var(--gray-800);outline:none;font-family:var(--font)">
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <label style="font-size:12px;color:var(--gray-400)">Au</label>
            <input type="date" id="filter-to" value="${dateTo}" onchange="dateTo=this.value;renderMain()" style="font-size:12px;border:1px solid var(--gray-200);border-radius:8px;padding:5px 8px;background:#fff;color:var(--gray-800);outline:none;font-family:var(--font)">
          </div>
          ${(dateFrom||dateTo)?`<button onclick="dateFrom='';dateTo='';renderMain()" style="font-size:12px;color:var(--gray-400);border:none;background:none;cursor:pointer;font-family:var(--font);text-decoration:underline">Réinitialiser</button>`:''}
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-label">Briefs (${filtered.length})</div>
      ${filtered.length === 0 ? `<div style="font-size:13px;color:var(--gray-400);padding:16px 0;text-align:center">Aucun brief pour ces filtres.</div>` :
        filtered.map(b => {
          const st = STATUTS.find(s=>s.id===b.statut) || STATUTS[0];
          const com = commerciaux.find(c=>c.id===b.commercial);
          const init = (b.compte||'?').substring(0,2).toUpperCase();
          const date = new Date(b.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
          return `<div class="brief-row">
            <div class="b-avatar" onclick="openDetail('${b.id}')" style="cursor:pointer">${init}</div>
            <div class="b-info" onclick="openDetail('${b.id}')" style="cursor:pointer">
              <div class="b-name">${b.compte||'?'} — ${b.campagne||'Sans titre'}</div>
              <div class="b-meta">${b.objectif||''} · ${date}${com?' · <span style="color:var(--sky)">'+com.name+'</span>':''}</div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
              <select class="status-select ${st.badge}" onchange="updateStatutInline('${b.id}',this.value,this)" onclick="event.stopPropagation()">
                ${STATUTS.map(s=>`<option value="${s.id}" ${b.statut===s.id?'selected':''}>${s.label}</option>`).join('')}
              </select>
              <button onclick="event.stopPropagation();toggleArchive('${b.id}',${b.archived?'true':'false'})" title="${b.archived?'Restaurer':'Archiver'}" style="padding:4px 8px;border-radius:8px;font-size:12px;border:1px solid var(--gray-200);background:${b.archived?'var(--amber-light)':'var(--gray-50)'};color:${b.archived?'var(--amber)':'var(--gray-400)'};cursor:pointer;flex-shrink:0">${b.archived?'↩':'📦'}</button>
            </div>
          </div>`;
        }).join('')}
    </div>
`;
}

// ─── DETAIL ───
async function openDetail(id) {
  detailBrief = briefs.find(b => b.id === id) || null;
  if (!detailBrief) {
    const { data } = await sb.from('briefs').select('*').eq('id', id).single();
    detailBrief = data;
  }
  view = 'detail';
  renderMain();
}

function renderDetail() {
  if (!detailBrief) return;
  const b = detailBrief;
  const st = STATUTS.find(s=>s.id===b.statut) || STATUTS[0];
  const com = commerciaux.find(c=>c.id===b.commercial);
  const isRegie = userRole === 'regie';
  const date = new Date(b.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});

  $('main').innerHTML = `
    <button class="btn-back-link" onclick="go(userRole==='regie'?'agency':'client')">← Retour</button>
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <div>
        <div class="page-title">${b.campagne||'Sans titre'}</div>
        <div class="page-sub" style="margin-bottom:0">${b.compte||''} · Déposé le ${date}</div>
      </div>
      ${isRegie ? `
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:12px;color:var(--gray-400)">Statut :</span>
          <select class="status-select" onchange="updateStatut('${b.id}',this.value)">
            ${STATUTS.map(s=>`<option value="${s.id}" ${b.statut===s.id?'selected':''}>${s.label}</option>`).join('')}
          </select>
          <button onclick="toggleArchive('${b.id}',${b.archived?'true':'false'})" style="padding:5px 12px;border-radius:20px;font-size:12px;border:1px solid var(--gray-200);background:${b.archived?'var(--amber-light)':'var(--gray-50)'};color:${b.archived?'var(--amber)':'var(--gray-600)'};cursor:pointer;font-family:var(--font);font-weight:500">
            ${b.archived ? '↩ Restaurer' : '📦 Archiver'}
          </button>
        </div>` : `<span class="badge ${st.badge}">${st.label}</span>`}
    </div>
    <div class="card">
      <div class="card-label">Informations générales</div>
      <div class="detail-grid">
        <div class="detail-item"><div class="detail-label">Compte</div><div class="detail-value">${b.compte||'—'}</div></div>
        <div class="detail-item"><div class="detail-label">Objectif</div><div class="detail-value">${b.objectif||'—'}</div></div>
        <div class="detail-item"><div class="detail-label">Période</div><div class="detail-value">${(b.debut && b.fin) ? b.debut + ' → ' + b.fin : 'Non renseignée'}</div></div>
        <div class="detail-item"><div class="detail-label">Budget</div><div class="detail-value">${b.budget||'—'}</div></div>
        <div class="detail-item"><div class="detail-label">Contact</div><div class="detail-value">${b.contact_name ? b.contact_name + '<br>' : ''}${b.email_contact||'—'}</div></div>
        <div class="detail-item"><div class="detail-label">Commercial</div><div class="detail-value">${com?.name||'—'}</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-label">Ciblages</div>
      <div class="detail-grid">
        <div class="detail-item"><div class="detail-label">Géographique</div><div class="detail-value">${b.geo||'—'}</div></div>
        <div class="detail-item"><div class="detail-label">Sociodémographique</div><div class="detail-value">${b.socio||'—'}</div></div>
        <div class="detail-item"><div class="detail-label">Signaux financiers</div><div class="detail-value">${b.signaux_financiers||'—'}</div></div>
        <div class="detail-item"><div class="detail-label">Moments de vie</div><div class="detail-value">${b.moments_vie||'—'}</div></div>
        <div class="detail-item" style="grid-column:span 2"><div class="detail-label">Intentions d'achat</div><div class="detail-value">${b.intentions||'—'}</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-label">Formats & URL</div>
      <div class="detail-grid">
        <div class="detail-item"><div class="detail-label">Formats</div><div class="detail-value">${b.formats||'—'}</div></div>
        <div class="detail-item"><div class="detail-label">Créas</div><div class="detail-value">${b.creas||'—'}</div></div>
        <div class="detail-item" style="grid-column:span 2"><div class="detail-label">URL principale</div><div class="detail-value">${b.url_principale?`<a href="${b.url_principale}" target="_blank" style="color:var(--sky)">${b.url_principale}</a>`:'—'}</div></div>
        ${b.urls_secondaires?`<div class="detail-item" style="grid-column:span 2"><div class="detail-label">URLs secondaires</div><div class="detail-value">${b.urls_secondaires}</div></div>`:''}
      </div>
    </div>
    ${b.kpis?`<div class="card"><div class="card-label">KPIs</div><div style="font-size:13.5px;color:var(--gray-800);line-height:1.6">${b.kpis}</div></div>`:''}
    ${b.infos_complementaires?`<div class="card"><div class="card-label">Informations complémentaires</div><div style="font-size:13.5px;color:var(--gray-800);line-height:1.6">${b.infos_complementaires}</div></div>`:''}
    ${isRegie ? `
    <div class="card" style="border:1px solid var(--gray-200);background:var(--gray-50)">
      <div class="card-label">Notes internes <span style="font-size:10px;font-weight:400;opacity:.5">(régie uniquement)</span></div>
      <textarea id="notes-input" placeholder="Commentaires internes, échanges entre commerciaux, points de vigilance…" style="width:100%;font-size:13.5px;border:1px solid var(--gray-200);border-radius:9px;padding:10px 12px;background:#fff;color:var(--gray-800);outline:none;font-family:var(--font);resize:vertical;min-height:100px;line-height:1.5">${b.notes_internes||''}</textarea>
      <div style="display:flex;justify-content:flex-end;margin-top:8px">
        <button onclick="saveNotes('${b.id}')" style="background:var(--gray-800);border:none;border-radius:9px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;color:#fff;font-family:var(--font)">Enregistrer</button>
      </div>
    </div>` : ''}
    <div class="card" style="border:1px solid var(--sky-mid);background:var(--sky-light)">
      <div class="card-label" style="color:var(--navy)">Plan média</div>
      ${isRegie ? `
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
        <input id="plan-media-input" type="url" placeholder="https://www.canva.com/..." value="${b.lien_plan_media||''}"
          style="flex:1;min-width:200px;font-size:14px;border:1px solid var(--sky-mid);border-radius:9px;padding:9px 12px;background:#fff;color:var(--navy);outline:none;font-family:var(--font)">
        <button onclick="savePlanMedia('${b.id}')" style="background:var(--navy);border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;color:#fff;font-family:var(--font);white-space:nowrap">Enregistrer</button>
      </div>` : ''}
      ${b.lien_plan_media ? `<a href="${b.lien_plan_media}" target="_blank" style="display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--navy);font-weight:500;text-decoration:none;background:#fff;border:1px solid var(--sky);border-radius:8px;padding:8px 14px">&#8599; Ouvrir le plan média</a>` : `<div style="font-size:13px;color:var(--gray-400)">${isRegie ? 'Aucun lien renseigné pour l’instant.' : 'Plan média en cours de préparation.'}</div>`}
    </div>`;
}

async function toggleArchive(id, isArchived) {
  const newVal = !isArchived;
  await sb.from('briefs').update({ archived: newVal }).eq('id', id);
  if (detailBrief && detailBrief.id === id) detailBrief.archived = newVal;
  const b = briefs.find(b=>b.id===id);
  if (b) b.archived = newVal;
  go(userRole==='regie'?'agency':'client');
}

async function saveNotes(id) {
  const input = document.getElementById('notes-input');
  if (!input) return;
  const notes = input.value;
  await sb.from('briefs').update({ notes_internes: notes }).eq('id', id);
  if (detailBrief && detailBrief.id === id) detailBrief.notes_internes = notes;
  const b = briefs.find(b=>b.id===id);
  if (b) b.notes_internes = notes;
  input.style.borderColor = 'var(--green)';
  setTimeout(() => { input.style.borderColor = 'var(--gray-200)'; }, 2000);
}

async function savePlanMedia(id) {
  const input = document.getElementById('plan-media-input');
  if (!input) return;
  const url = input.value.trim();
  await sb.from('briefs').update({ lien_plan_media: url }).eq('id', id);
  if (detailBrief && detailBrief.id === id) detailBrief.lien_plan_media = url;
  const b = briefs.find(b=>b.id===id);
  if (b) b.lien_plan_media = url;
  // Show confirmation
  input.style.borderColor = 'var(--green)';
  setTimeout(() => { input.style.borderColor = 'var(--sky-mid)'; }, 2000);
}

async function updateStatutInline(id, newStatut, selectEl) {
  await sb.from('briefs').update({ statut: newStatut }).eq('id', id);
  const b = briefs.find(b=>b.id===id);
  if (b) b.statut = newStatut;
  // Update select color class
  const st = STATUTS.find(s=>s.id===newStatut);
  if (st && selectEl) {
    STATUTS.forEach(s => selectEl.classList.remove(s.badge));
    selectEl.classList.add(st.badge);
  }
}

async function updateStatut(id, newStatut) {
  await sb.from('briefs').update({ statut: newStatut }).eq('id', id);
  if (detailBrief && detailBrief.id === id) detailBrief.statut = newStatut;
  const b = briefs.find(b=>b.id===id);
  if (b) {
    b.statut = newStatut;
    if (b.email_contact) {
      fetch('/api/notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'status_change', brief: b, clientEmail: b.email_contact })
      }).catch(() => {});
    }
  }
}

// ─── HELPERS ───
function go(v) {
  // Save current step data before navigating
  if (view === 'form') saveStep();
  view = v;
  renderApp();
}
function saveStep() {
  if(formStep===0){['compte','camp','deb','fin','budget','email'].forEach(k=>{const e=$('f-'+k);if(e)fd[k]=e.value});}
  if(formStep===1){const e=$('f-kpis');if(e)fd.kpis=e.value;}
  if(formStep===2){['geo','socio','fin2','moments','intent'].forEach(k=>{const e=$('f-'+k);if(e)fd[k]=e.value});}
  if(formStep===4){const e=$('f-url');if(e)fd.urlMain=e.value;}
  if(formStep===6){const e=$('f-infos');if(e)fd.infos=e.value;}
}
function tFmt(v){if(!fd.fmts)fd.fmts=[];fd.fmts.includes(v)?fd.fmts=fd.fmts.filter(f=>f!==v):fd.fmts.push(v);renderMain();}
function aUrl(){const i=$('url-inp');if(!i||!i.value.trim())return;if(!fd.urls)fd.urls=[];fd.urls.push(i.value.trim());i.value='';const t=$('url-tags');if(t)t.innerHTML=fd.urls.map(u=>`<span class="url-tag">${u}<button onclick="rUrl('${u}')">×</button></span>`).join('');}
function rUrl(u){fd.urls=(fd.urls||[]).filter(x=>x!==u);const t=$('url-tags');if(t)t.innerHTML=fd.urls.map(v=>`<span class="url-tag">${v}<button onclick="rUrl('${v}')">×</button></span>`).join('');}


// ─── FORGOT PASSWORD ───
function showForgot() {
  const card = document.querySelector('.auth-card');
  if (!card) return;
  card.innerHTML = `
    <div class="auth-logo">
      <span class="auth-logo-main">THE GOOD WEB</span>
      <span class="auth-logo-sub">· THE GOOD AUDIENCE</span>
    </div>
    <div id="auth-error" class="auth-error"></div>
    <div class="auth-title">Mot de passe oublié</div>
    <div class="auth-sub" style="margin-bottom:20px">Entrez votre email pour recevoir un lien de réinitialisation.</div>
    <div class="field"><label>Email</label><input id="forgot-email" type="email" placeholder="votre@email.com"></div>
    <button class="btn-primary" onclick="doForgot()">Envoyer le lien</button>
    <div style="text-align:center;margin-top:14px">
      <button style="background:none;border:none;font-size:12px;color:var(--gray-400);cursor:pointer;font-family:var(--font)" onclick="renderAuth()">← Retour à la connexion</button>
    </div>`;
}

async function doForgot() {
  const email = document.getElementById('forgot-email')?.value;
  if (!email) return;
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.href
  });
  const el = document.getElementById('auth-error');
  if (el) {
    el.style.display = 'block';
    if (error) {
      el.style.background = 'var(--red-light)';
      el.style.color = 'var(--red)';
      el.textContent = 'Erreur, veuillez réessayer.';
    } else {
      el.style.background = 'var(--green-light)';
      el.style.color = 'var(--green)';
      el.textContent = 'Email envoyé ! Vérifiez votre boite mail.';
    }
  }
}

function togglePwd(id, btn) {
  const input = document.getElementById(id);
  if (!input) return;
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁';
  }
}

function setAuthMode(m){authMode=m;renderAuth();}
init();
</script>
</body>
</html>
